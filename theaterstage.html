<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>劇場公演 | 48グループ データベース</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <h1>劇場公演</h1>

  <a href="index.html" class="back-button">
    ← トップへ戻る
  </a>

  <div class="controls">

    <select id="group-select">
      <option value="akb48">AKB48</option>
      <option value="ske48">SKE48</option>
      <option value="nmb48">NMB48</option>
      <option value="hkt48">HKT48</option>
      <option value="ngt48">NGT48</option>
      <option value="stu48">STU48</option>
    </select>

    <select id="stage-select">
      <option value="">演目を選択</option>
    </select>

  </div>

</header>

<main>

  <!-- =========================
       ◾︎ 履歴（ここが上）
  ========================= -->
  <section class="block">

    <h2>履歴</h2>

    <!-- メンバー検索 -->
    <div class="stage-search">
      <input
        type="text"
        id="stage-search-input"
        placeholder="メンバー名で検索"
      >
    </div>

    <!-- 固定ポジション比較表 -->
    <div id="stage-table-container"></div>

    <!-- 検索結果 -->
    <div id="stage-analysis" class="stage-analysis"></div>

  </section>


  <!-- =========================
       ◾︎ ポジション予想（下）
  ========================= -->

  <!-- ※ここはあなた指定の“そのまま構造” -->
  <section class="block">

    <h2>ポジション予想</h2>

    <p class="description">
      出演メンバーを「、」または「・」区切りで入力してください。
    </p>

    <!-- 入力 -->
    <textarea
      id="member-input"
      placeholder="小栗有以・倉野尾成美・佐藤綺星・下尾みう・鈴木くるみ・千葉恵里・永野芹佳・水島美結・向井地美音・村山彩希・山内瑞葵・山﨑空・秋山由奈・八木愛月・山口結愛・伊藤百花"
      rows="6"
    ></textarea>

    <!-- ボタン -->
    <div style="text-align: right; margin-top: 10px;">
      <button id="assign-btn">
        割り当て開始
      </button>
    </div>

    <!-- 予想結果 -->
<div class="prediction-scroll">
  <section id="result" aria-live="polite" class="result-box"></section>
</div>

</section>

</main>
<script type="module" src="main.js"></script>

</body>
</html>
