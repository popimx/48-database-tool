<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>劇場公演 | 48グループ データベース</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <h1>劇場公演</h1>

  <a href="index.html" class="back-button">
    ← トップへ戻る
  </a>

  <div class="controls">

    <select id="group-select">
      <option value="akb48">AKB48</option>
      <option value="ske48">SKE48</option>
      <option value="nmb48">NMB48</option>
      <option value="hkt48">HKT48</option>
      <option value="ngt48">NGT48</option>
      <option value="stu48">STU48</option>
    </select>

    <select id="stage-select">
      <option value="">演目を選択</option>
    </select>

  </div>

</header>


<main>

  <!-- =========================
       履歴
  ========================= -->

  <section class="block">

    <h2>履歴</h2>

    <div class="stage-search">

      <input
        type="text"
        id="stage-search-input"
        placeholder="メンバー名で検索"
      >

    </div>

    <div id="stage-table-container"></div>

    <div
      id="stage-analysis"
      class="stage-analysis">
    </div>

  </section>


  <!-- =========================
       ポジション予想
  ========================= -->

  <section class="block">

    <h2>ポジション予想</h2>

    <p class="description">
      出演メンバーを五十音順で貼り付けてください。
      「、」「・」「改行」のいずれにも対応しています。
    </p>

    <textarea
      id="member-input"
      placeholder="小栗有以・倉野尾成美・佐藤綺星・下尾みう・鈴木くるみ・千葉恵里・永野芹佳・水島美結・向井地美音・村山彩希・山内瑞葵・山﨑空・秋山由奈・八木愛月・山口結愛・伊藤百花"
      rows="8"
    ></textarea>

    <div class="button-area">

      <button
        id="assign-btn"
        class="primary-button">
        ポジションを予想
      </button>

    </div>

    <div
      id="prediction-summary"
      class="prediction-summary">
    </div>

    <div
      id="result"
      class="result-box"
      aria-live="polite">
    </div>

  </section>


  <!-- =========================
       管理者
  ========================= -->

  <section class="block admin-block">

    <h2>管理者</h2>

    <button
      id="admin-edit-btn"
      class="admin-button">
      🔒 管理者モード
    </button>


    <div
      id="admin-panel"
      class="admin-panel"
      hidden>

      <!-- =====================
           初日データ
      ====================== -->

      <h3>初日データ</h3>

      <p class="description">
        初日出演メンバーを五十音順で貼り付けてください。
      </p>

      <textarea
        id="debut-members-input"
        rows="8"
        placeholder="青原優花、青原和花、池帆乃香……"
      ></textarea>


      <h4>初日ポジション</h4>

      <p class="description">
        左側がポジション、右側が初日の出演メンバーです。
      </p>

      <div
        id="debut-position-editor"
        class="position-editor">
      </div>


      <!-- =====================
           公演追加
      ====================== -->

      <h3>公演データ追加</h3>

      <label>
        公演日
      </label>

      <input
        type="date"
        id="performance-date"
      >


      <p class="description">
        出演メンバーを五十音順で貼り付けてください。
      </p>

      <textarea
        id="performance-members-input"
        rows="8"
        placeholder="青原優花、青原和花、池帆乃香……"
      ></textarea>


      <div class="button-area">

        <button
          id="add-performance-btn"
          class="primary-button">
          公演データを追加
        </button>

      </div>


      <!-- =====================
           履歴編集
      ====================== -->

      <h3>登録済み公演</h3>

      <div
        id="admin-history-list"
        class="admin-history-list">
      </div>


      <!-- =====================
           保存
      ====================== -->

      <div class="admin-save-area">

        <button
          id="save-admin-btn"
          class="primary-button">
          保存
        </button>

        <button
          id="export-json-btn"
          class="secondary-button">
          JSONを書き出す
        </button>

      </div>

      <div
        id="admin-message"
        class="admin-message">
      </div>

    </div>

  </section>

</main>


<script type="module" src="main.js"></script>

</body>
</html>
