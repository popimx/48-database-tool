<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>劇場公演 | 48グループ データベース</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>

    <h1>劇場公演</h1>

    <a href="index.html" class="back-button">
      ← トップへ戻る
    </a>

    <div class="controls">

      <select id="group-select">
        <option value="akb48">AKB48</option>
        <option value="ske48">SKE48</option>
        <option value="nmb48">NMB48</option>
        <option value="hkt48">HKT48</option>
        <option value="ngt48">NGT48</option>
        <option value="stu48">STU48</option>
      </select>

    </div>

  </header>

  <main>

    <!-- 演目タイトルなど -->
    <div id="stage-summary" class="stage-summary"></div>

    <!-- メンバー一覧（固定ポジション） -->
    <div id="stage-member-list" class="stage-member-list"></div>

    <!-- 日別ポジション一覧 -->
    <div id="stage-daily-list" class="stage-daily-list"></div>

    <!-- 検索・分析エリア -->
    <div id="stage-analysis" class="stage-analysis"></div>

  </main>

  <!-- ★重要：ES Modules対応 -->
  <script type="module" src="main.js"></script>

</body>
</html>
