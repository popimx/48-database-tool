<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>人数遷移 | 48グループ データベース</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>人数遷移</h1>

    <a href="index.html" class="back-button">
      ← トップへ戻る
    </a>
  </header>

  <main>

    <div class="timeline-summary">

      <div class="timeline-summary-card">
        <div class="timeline-summary-label">
          現在の人数
        </div>

        <div
          class="timeline-summary-value"
          id="current-member-count"
        >
          -
        </div>
      </div>

    </div>

    <div
      class="generation-grid"
      id="generation-count"
    ></div>

    <div
      class="timeline-list"
      id="timeline-list"
    ></div>

  </main>

  <script src="main.js"></script>

</body>
</html>
